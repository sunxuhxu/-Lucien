:root{

}
*{box-sizing:border-box;margin:0;padding:0}
body{

.wrap{max-width:860px;margin:0 auto;padding:20px 16px}
header{text-align:center;padding:26px 0 8px}

.tabs{
  position:sticky;top:0;z-index:20;display:flex;gap:8px;overflow-x:auto;
  background:rgba(243,238,251,.92);backdrop-filter:blur(8px);
  padding:12px 2px;border-radius:0 0 14px 14px;margin-bottom:14px;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex-shrink:0;display:flex;align-items:center;gap:6px;padding:9px 14px;
  border-radius:999px;border:1px solid var(--border);background:var(--elev);
  color:var(--dim);font-size:13px;cursor:pointer;transition:all var(--dur-fast);
  user-select:none;
}
.tab:hover{border-color:var(--border-strong);color:var(--primary)}
.tab.on{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(124,58,237,.3)}
.tab .dot{font-size:15px}
.panel{display:none}
.panel.on{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{
  background:var(--elev);border:1px solid var(--border);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-md);padding:18px;margin-bottom:14px;
}
.card h3{font-size:15px;color:var(--primary-dim);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .bar{width:4px;height:16px;border-radius:2px;background:linear-gradient(180deg,var(--primary),var(--pink))}
label{font-size:12.5px;color:var(--dim);display:block;margin:10px 0 6px}
input[type=text],input[type=number],textarea,select{
  width:100%;border:1px solid var(--border);border-radius:var(--radius-md);
  padding:10px 12px;font-size:13.5px;font-family:inherit;background:var(--card);
  color:var(--text);outline:none;transition:border var(--dur-fast);
}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}
textarea{resize:vertical;min-height:70px;line-height:1.6}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 18px;border:none;border-radius:999px;font-size:13.5px;font-weight:600;
  cursor:pointer;transition:all var(--dur-fast);color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  box-shadow:0 6px 16px rgba(124,58,237,.25);
}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(124,58,237,.32)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:wait;transform:none}
.btn.ghost{background:var(--card);color:var(--primary);border:1px solid var(--border-strong);box-shadow:none}
.btn.pink{background:linear-gradient(135deg,var(--pink),var(--accent))}
.btn.small{padding:6px 12px;font-size:12px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.hint{font-size:12px;color:var(--faint);margin-top:8px;line-height:1.6}
.msg{font-size:12.5px;color:var(--dim);margin-top:10px;line-height:1.6}
.msg.err{color:#dc2626}

.divider{height:1px;background:var(--border);margin:14px 0}
.item{

function wmoText(code){
  const m={0:'�?,1:'晴间多云',2:'多云',3:'�?,45:'�?,48:'雾凇',51:'毛毛�?,53:'毛毛�?,55:'毛毛�?,
    56:'冻雨',57:'冻雨',61:'小雨',63:'中雨',65:'大雨',66:'冻雨',67:'冻雨',71:'小雪',73:'中雪',75:'大雪',
    77:'米雪',80:'阵雨',81:'阵雨',82:'强阵�?,85:'阵雪',86:'阵雪',95:'雷阵�?,96:'雷雨伴冰�?,99:'雷雨伴冰�?};
  return m[code]||'多云';
}
async function weatherAuto(){
  busy('weatherAutoBtn',true);$('wxArea').innerHTML='';
  if(!navigator.geolocation){$('wxArea').innerHTML='<span class="msg err">浏览器不支持定位，请手动填写</span>';busy('weatherAutoBtn',false);return}
  navigator.geolocation.getCurrentPosition(async function(pos){
    const lat=pos.coords.latitude.toFixed(2), lon=pos.coords.longitude.toFixed(2);
    let city='你的城市', wx='多云', temp='';
    try{
      const w = await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,weather_code&timezone=auto');
      const wj = await w.json();
      const cur = wj.current||{};
      wx = wmoText(cur.weather_code);
      temp = (cur.temperature_2m!=null?Math.round(cur.temperature_2m):'')+'°C';
    }catch(e){}
    try{
      const g = await fetch('https://nominatim.openstreetmap.org/reverse?lat='+lat+'&lon='+lon+'&format=json&accept-language=zh');
      const gj = await g.json();
      city = (gj.address&&(gj.address.city||gj.address.town||gj.address.village))||city;
    }catch(e){}
    $('wxCity').value=city;$('wxKind').value=wx;$('wxTemp').value=temp;
    await weatherSync();
    busy('weatherAutoBtn',false);
  },async function(){
    $('wxArea').innerHTML='<span class="msg err">定位失败，请手动填写天气</span>';
    busy('weatherAutoBtn',false);

  fab.type = 'button';
  fab.title = '换背景图';
  fab.setAttribute('aria-label', '换背景图');
  fab.textContent = '🖼�?;

  var panel = document.createElement('div');
  panel.className = 'lucien-bg-panel';
  panel.innerHTML =
    '<h4>页面背景</h4>' +
    '<div class="lbg-row"><label>透明�?/label>' +
    '<input type="range" min="0" max="100" value="22" id="lbgOp">' +
    '<span class="lbg-val" id="lbgOpVal">22%</span></div>' +
    '<div class="lbg-acts"><button type="button" class="lbg-btn lbg-upload" id="lbgUpload">上传图片</button>' +
    '<button type="button" class="lbg-btn lbg-reset" id="lbgReset">恢复默认</button></div>' +
    '<input type="file" class="lbg-file" id="lbgFile" accept="image/png,image/jpeg,image/webp,image/gif">' +
    '<div class="lbg-tip">支持 png / jpg / webp / gif。背景只作用于当前页面，并保存在本机�?/div>';

  document.body.appendChild(fab);
  document.body.appendChild(panel);

  var opInput = panel.querySelector('#lbgOp');
  var opVal = panel.querySelector('#lbgOpVal');
  var fileInput = panel.querySelector('#lbgFile');

  fab.addEventListener('click', function (e) {
    e.stopPropagation();
    panel.classList.toggle('open');
  });
  document.addEventListener('click', function (e) {
    if (panel.classList.contains('open') && !panel.contains(e.target) && e.target !== fab) {
      panel.classList.remove('open');
    }
  });
  opInput.addEventListener('input', function () {
    var v = parseInt(opInput.value, 10);
    opVal.textContent = v + '%';
    applyOpacity(v);
  });
  panel.querySelector('#lbgUpload').addEventListener('click', function () { fileInput.click(); });
  panel.querySelector('#lbgReset').addEventListener('click', function () {
    try { localStorage.removeItem(IMG_KEY); } catch (e) {}
    applyImg(null);
    panel.classList.remove('open');
  });
  fileInput.addEventListener('change', function (e) {
    var f = e.target.files[0];
    if (!f) return;
    if (f.size > 10 * 1024 * 1024) { alert('图片不能超过 10MB'); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 1600, w = img.width, h = img.height;
        if (w > max || h > max) {
          var r = Math.min(max / w, max / h);
          w = Math.round(w * r); h = Math.round(h * r);
        }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        var dataUrl;
        try { dataUrl = c.toDataURL('image/jpeg', 0.82); }
        catch (err) { alert('图片格式不支持，请换一�?); return; }
        try { localStorage.setItem(IMG_KEY, dataUrl); }
        catch (err) { alert('图片过大，无法在本机保存（请换更小的图）'); return; }
        applyImg(dataUrl);
      };
      img.onerror = function () { alert('图片读取失败'); };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
    e.target.value = '';
  });

  // 初始�?  try {
    var savedOp = parseInt(localStorage.getItem(OP_KEY) || '22', 10);
    if (isNaN(savedOp)) savedOp = 22;
    opInput.value = savedOp;
    opVal.textContent = savedOp + '%';
    applyOpacity(savedOp);
    var savedImg = localStorage.getItem(IMG_KEY);
    if (savedImg) applyImg(savedImg);
  } catch (e) {}
})();

</script>

<script src="/static/global-bgm.js?v=1" defer></script>
</body>
