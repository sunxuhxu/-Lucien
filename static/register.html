<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>许墨 · 注册新账号</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #1e1030 0%, #3b1d63 55%, #7c3aed 130%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #f3eefc; padding: 28px 16px 60px;
  }
  .wrap { max-width: 540px; margin: 0 auto; }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .title { font-size: 20px; font-weight: 600; letter-spacing: 2px; }
  .title .em { margin-right: 8px; }
  a.back { color: #c4b5fd; font-size: 13px; text-decoration: none; opacity: .85; }
  .card {
    background: rgba(255,255,255,0.07); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.14); border-radius: 18px;
    padding: 24px 24px 28px; margin-bottom: 18px;
  }
  .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 6px; letter-spacing: 1px; }
  .card .desc { font-size: 12.5px; opacity: .72; margin-bottom: 16px; line-height: 1.7; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; margin-bottom: 6px; letter-spacing: .5px; }
  .field label .opt { opacity: .5; font-size: 11px; margin-left: 6px; }
  .field label .hint { opacity: .55; font-size: 11px; display: block; margin-top: 2px; }
  input[type=text], input[type=password], input[type=date], select {
    width: 100%; padding: 11px 14px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.09);
    color: #fff; font-size: 14px; outline: none; transition: border .2s;
  }
  input:focus, select:focus { border-color: #db2777; }
  input::placeholder { opacity: .45; }
  select option { background: #2a1654; color: #fff; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .row2 { grid-template-columns: 1fr; } }
  .avatar-pick { display: flex; align-items: center; gap: 14px; }
  .avatar-preview {
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(255,255,255,.08); border: 2px dashed rgba(255,255,255,.3);
    background-size: cover; background-position: center; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 11px; opacity: .55;
  }
  .avatar-pick input[type=file] { color: #fff; font-size: 12px; flex: 1; }
  button {
    width: 100%; padding: 13px; border: none; border-radius: 12px;
    background: linear-gradient(90deg, #7c3aed, #db2777); color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer; letter-spacing: 3px;
    transition: opacity .2s;
  }
  button:hover { opacity: .9; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .ghost-btn { background: transparent; border: 1px solid rgba(255,255,255,.28); color: rgba(255,255,255,.82); letter-spacing: 1px; margin-top: 10px; }
  .ghost-btn:hover { background: rgba(255,255,255,.08); }
  .err { color: #fda4af; font-size: 13px; margin-top: 12px; min-height: 18px; text-align: center; }
  .ok { color: #bbf7d0; }
  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    background: rgba(20,6,40,.92); border: 1px solid rgba(255,255,255,.2); color: #fff;
    padding: 12px 20px; border-radius: 12px; font-size: 13.5px; opacity: 0;
    pointer-events: none; transition: opacity .25s; z-index: 99;
  }
  .toast.show { opacity: 1; }
  .guide { font-size: 12px; opacity: .65; line-height: 1.8; padding: 12px 14px; border-radius: 10px;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); margin-top: 8px; }
  .guide b { color: #e9d5ff; }
  .guide li { margin-left: 16px; margin-top: 4px; }
  .pwd-strength { height: 4px; border-radius: 2px; background: rgba(255,255,255,.1); margin-top: 6px; overflow: hidden; }
  .pwd-strength > div { height: 100%; width: 0; transition: width .3s, background .3s; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="title"><span class="em">🦋</span>注册新账号</div>
    <a class="back" href="/">← 返回登录</a>
  </div>

  <div class="card">
    <h2>创建你的专属空间</h2>
    <div class="desc">注册后，你的对话、记忆、相册、世界进度都将完整隔离在 <code>users_data/&lt;你的用户名&gt;/</code> 下，与其它账号互不干扰。</div>

    <div class="field">
      <label>用户名 <span class="hint">2-32 位中英文 / 数字 / 下划线，注册后不可修改</span></label>
      <input type="text" id="username" placeholder="例如：xumo_fan" autocomplete="username" autofocus>
    </div>

    <div class="field">
      <label>密码 <span class="hint">至少 8 位，建议混合数字 + 字母</span></label>
      <input type="password" id="password" placeholder="设置登录密码" autocomplete="new-password">
      <div class="pwd-strength"><div id="pwdBar"></div></div>
    </div>

    <div class="field">
      <label>确认密码</label>
      <input type="password" id="password2" placeholder="再输一次上面的密码" autocomplete="new-password">
    </div>
  </div>

  <div class="card">
    <h2>个人资料 <span style="font-size:11px; opacity:.5; font-weight:400;">（可选，跳过也能注册）</span></h2>
    <div class="desc">这些资料会被许墨用作称呼你、记得你的依据。所有字段后续可在「数据管理」页修改。</div>

    <div class="field">
      <label>昵称 <span class="opt">选填</span><span class="hint">许墨会用这个名字称呼你，1-24 位</span></label>
      <input type="text" id="nickname" placeholder="例如：小蝶">
    </div>

    <div class="field">
      <label>头像 <span class="opt">选填</span><span class="hint">支持 PNG / JPG / WEBP，最大 2MB</span></label>
      <div class="avatar-pick">
        <div class="avatar-preview" id="avatarPreview">未设置</div>
        <input type="file" id="avatarFile" accept="image/png,image/jpeg,image/webp,image/gif">
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>生日 <span class="opt">选填</span></label>
        <input type="date" id="birthday">
      </div>
      <div class="field">
        <label>性别 <span class="opt">选填</span></label>
        <select id="gender">
          <option value="">不设置</option>
          <option value="female">女</option>
          <option value="male">男</option>
          <option value="other">其它</option>
        </select>
      </div>
    </div>

    <div class="guide">
      <b>注册说明</b>
      <ul>
        <li>同一 IP 每分钟最多注册 5 次，超出需等待。</li>
        <li>密码使用 PBKDF2-SHA256 加盐哈希（10 万轮）存储，服务端无法逆向。</li>
        <li>会话 cookie 有效期 30 天，可在「数据管理」页注销所有会话。</li>
        <li>注册成功后会自动登录并跳转回首页。</li>
      </ul>
    </div>
  </div>

  <button id="submitBtn" onclick="doSubmit()">立 即 注 册</button>
  <button class="ghost-btn" onclick="location.href='/'">已有账号 · 返回登录</button>
  <div class="err" id="err"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let _avatarDataUrl = '';

function toast(msg, ok=true) {
  const t = $('toast');
  t.textContent = msg;
  t.style.borderColor = ok ? 'rgba(255,255,255,.2)' : '#fda4af';
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2400);
}
function setErr(m, ok=false) {
  const e = $('err');
  e.textContent = m || '';
  e.className = 'err' + (ok ? ' ok' : '');
}

// 头像预览
$('avatarFile').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  if (f.size > 2 * 1024 * 1024) { toast('头像不能超过 2MB', false); e.target.value = ''; return; }
  const reader = new FileReader();
  reader.onload = ev => {
    _avatarDataUrl = ev.target.result;
    $('avatarPreview').style.backgroundImage = `url(${_avatarDataUrl})`;
    $('avatarPreview').textContent = '';
  };
  reader.readAsDataURL(f);
});

// 密码强度
$('password').addEventListener('input', e => {
  const v = e.target.value;
  let score = 0;
  if (v.length >= 8) score++;
  if (v.length >= 12) score++;
  if (/[A-Za-z]/.test(v) && /\d/.test(v)) score++;
  if (/[^A-Za-z0-9]/.test(v)) score++;
  const bar = $('pwdBar');
  const colors = ['transparent', '#f87171', '#fbbf24', '#facc15', '#34d399'];
  const widths = ['0%', '25%', '50%', '75%', '100%'];
  bar.style.width = widths[score];
  bar.style.background = colors[score];
});

// 实时校验密码一致
$('password2').addEventListener('input', e => {
  const p = $('password').value;
  const p2 = e.target.value;
  if (p2 && p !== p2) e.target.style.borderColor = '#fda4af';
  else e.target.style.borderColor = '';
});

async function doSubmit() {
  const u = $('username').value.trim();
  const p = $('password').value;
  const p2 = $('password2').value;
  const nickname = $('nickname').value.trim();
  const birthday = $('birthday').value;
  const gender = $('gender').value;
  const USERNAME_RE = /^[A-Za-z0-9_\u4e00-\u9fa5]{2,32}$/;

  if (!u) { setErr('请填写用户名'); return; }
  if (!USERNAME_RE.test(u)) { setErr('用户名需为 2-32 位中英文、数字或下划线'); return; }
  if (!p) { setErr('请填写密码'); return; }
  if (p.length < 8) { setErr('密码至少 8 位'); return; }
  if (p !== p2) { setErr('两次输入的密码不一致'); return; }

  const body = { username: u, password: p };
  if (nickname) body.nickname = nickname;
  if (birthday) body.birthday = birthday;
  if (gender) body.gender = gender;
  if (_avatarDataUrl) body.avatar = _avatarDataUrl;

  $('submitBtn').disabled = true;
  $('submitBtn').textContent = '提交中…';
  setErr('');
  try {
    const r = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok) {
      toast('注册成功，正在进入…');
      setTimeout(() => location.href = '/', 800);
    } else if (r.status === 429) {
      setErr(d.detail || '注册过于频繁，请稍后再试');
      $('submitBtn').disabled = false;
      $('submitBtn').textContent = '立 即 注 册';
    } else {
      setErr(d.detail || '注册失败');
      $('submitBtn').disabled = false;
      $('submitBtn').textContent = '立 即 注 册';
    }
  } catch (e) {
    setErr('网络异常，请重试');
    $('submitBtn').disabled = false;
    $('submitBtn').textContent = '立 即 注 册';
  }
}

// 回车提交（避免在文件选择框上误触发）
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName !== 'SELECT' && e.target.type !== 'file') {
    doSubmit();
  }
});
</script>
</body>
</html>
